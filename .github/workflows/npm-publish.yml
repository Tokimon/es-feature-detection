name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: bun install --frozen-lockfile

      - name: Release tag matches package.json version
        run: test "${{ github.event.release.tag_name }}" = "v$(node -p "require('./package.json').version")"

      # prepublishOnly runs `validate` and `build`.
      # Pre-releases go to the `next` dist-tag so `npm i es-feature-detection` keeps installing the latest stable.
      - run: npm publish --provenance ${{ github.event.release.prerelease && '--tag next' || '' }}
